<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan-Tilt Local Test</title>
    <style>
        .header {
            text-align: center;
            padding: 5px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 3px solid #9e9e9e;
            background-color: #323E4C;
        }
        .app-title {
            font-size: 24px;
            font-weight: bold;
            margin-top: 0px;
            padding: 0px;
        }
        body, h1, form, select, input, button {
            margin: 0;
            padding: 0;
            border: 0;
            font-family: Arial, sans-serif;
            max-width: 100%;
        }
        body {
            margin-top: 90px;
            background-color: #1B2938;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            background: #f8f1f1;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(153, 153, 153, 0.589);
        }
        p {
            color: #d1d1d1;
            font-size: 20px;
            text-align: center;
            margin: 2px;
        }
        h1 {
            color: #2599BC;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        h2 {
            color: #f8f8f8;
            font-size: 40px;
            text-align: center;
            margin: 2px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        form input,
        form select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        form label {
            display: block;
            width: 100%;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        button {
            background-color: #0056b3;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004494;
        }
        #measureBtn {
            background-color: #007d00;
            color: white;
            width: 100%;
            text-align: center;
        }
        #measureBtn:hover {
            background-color: #006400;
        }
        #output {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #e9ecef;
            border-bottom: 3px solid #0056b3;
            padding: 10px 20px;
            color: #333;
            text-align: center;
            z-index: 9999;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .timer-box {
            margin-top: 10px;
            background-color: #f3f3f3;
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        #statusLine {
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        .angles-rel {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-top: 10px;
        }
        .angles-abs {
            color: #9e9e9e;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
        }
        .grey-note {
            color: #9e9e9e;
            font-size: 12px;
            text-align: center;
        }
        .limit-hint {
            color: #333;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            margin-bottom: 3px;
        }
        .card-disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .jog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        .jog-grid button {
            margin-top: 0;
            padding: 10px 0;
        }
        #programDetails table, #upcomingStepsTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 8px;
        }
        #programDetails th, #programDetails td, #upcomingStepsTable th, #upcomingStepsTable td {
            border: 1px solid #ccc;
            padding: 4px;
            text-align: center;
        }
        tr.point-warn {
            background-color: #ffe08a;
        }
        tr.point-error {
            background-color: #ff9d9d;
        }
        #faultContainer {
            background-color: #ff2323;
        }
        #faultContainer h1, #faultContainer p {
            color: white;
        }
        #logPanel {
            max-height: 160px;
            overflow-y: auto;
            background-color: #10161f;
            color: #b7ffb7;
            font-family: Consolas, monospace;
            font-size: 12px;
            padding: 8px;
            border-radius: 4px;
            text-align: left;
        }
        #logPanel div {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>WAVETRAX</h2>
        <div class="app-title">
            <p>Pan-Tilt Local Test</p>
        </div>
    </div>

    <div id="output" style="display:none;"></div>

    <div class="container">
        <h1>Positioner</h1>
        <div id="statusLine">Connecting…</div>
        <div id="angles" style="display:none;">
            <div class="angles-rel">pan <span id="panRel">-</span>&deg; &nbsp; tilt <span id="tiltRel">-</span>&deg;<span id="movingIndicator"></span></div>
            <div class="angles-abs">absolute: pan <span id="panAbs">-</span>&deg; / tilt <span id="tiltAbs">-</span>&deg;</div>
        </div>
    </div>

    <div id="faultContainer" class="container" style="display:none;">
        <h1>Fault</h1>
        <p id="faultText" style="font-size:14px;"></p>
        <button id="clearFaultBtn" onclick="clearFault()" style="display:block; margin:10px auto;">Clear Fault</button>
    </div>

    <div class="container">
        <h1>Log</h1>
        <div id="logPanel"></div>
    </div>

    <div id="calibrationCard" class="container">
        <h1>Calibration</h1>
        <form id="calibrationForm">
            <div class="form-group">
                <label for="stepSize">Step size (&deg;):</label>
                <select id="stepSize">
                    <option value="0.1">0.1</option>
                    <option value="1" selected>1</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
            </div>
            <div class="jog-grid">
                <div></div>
                <button type="button" onclick="jog(0, 1)">Tilt &#9650;</button>
                <div></div>
                <button type="button" onclick="jog(-1, 0)">&#9664; Pan</button>
                <button type="button" onclick="goHome()">Home</button>
                <button type="button" onclick="jog(1, 0)">Pan &#9654;</button>
                <div></div>
                <button type="button" onclick="jog(0, -1)">Tilt &#9660;</button>
                <div></div>
            </div>
            <div class="form-group">
                <button type="button" id="measureBtn" onclick="takeMeasurement()">Take Virtual Measurement</button>
            </div>
            <div class="form-group">
                <label>Go to relative position (&deg;):</label>
                <div style="display: flex; gap: 5px;">
                    <div style="flex:1">
                        <div id="panLimitsLine" class="limit-hint"></div>
                        <input type="number" id="gotoPan" placeholder="Pan" step="0.1" style="width:100%">
                    </div>
                    <div style="flex:1">
                        <div id="tiltLimitsLine" class="limit-hint"></div>
                        <input type="number" id="gotoTilt" placeholder="Tilt" step="0.1" style="width:100%">
                    </div>
                </div>
                <button type="button" onclick="moveTo()">Move</button>
            </div>
        </form>

        <details>
            <summary style="cursor:pointer;">Show advanced settings</summary>
            <form id="settingsForm" style="margin-top:10px;">
                <div class="form-group">
                    <label><input type="checkbox" id="unlockHome" style="width:auto; margin-right:5px;">Unlock home position</label>
                    <button type="button" onclick="setHomePosition()">Set current position as Home Position</button>
                </div>
                <div class="form-group">
                    <label>Mounting orientation (mounted upside-down or reversed flips the +/- sign):</label>
                    <label><input type="checkbox" id="pan_invert" style="width:auto; margin-right:5px;">Invert pan</label>
                    <label><input type="checkbox" id="tilt_invert" style="width:auto; margin-right:5px;">Invert tilt</label>
                </div>
                <div class="form-group">
                    <label>Absolute pan limits (&deg;, min / max):</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="pan_min_abs" min="-180" max="180" step="0.1" style="flex:1">
                        <input type="number" id="pan_max_abs" min="-180" max="180" step="0.1" style="flex:1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Absolute tilt limits (&deg;, min / max):</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="tilt_min_abs" min="-90" max="90" step="0.1" style="flex:1">
                        <input type="number" id="tilt_max_abs" min="-90" max="90" step="0.1" style="flex:1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Maximum speed (1-127, pan / tilt):</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="pan_max_speed" min="1" max="127" style="flex:1">
                        <input type="number" id="tilt_max_speed" min="1" max="127" style="flex:1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="settle_seconds">Settle time before measurement (s):</label>
                    <input type="number" id="settle_seconds" min="0" max="60">
                </div>
                <div class="form-group">
                    <label for="simulated_measure_seconds">Simulated measurement duration (s):</label>
                    <input type="number" id="simulated_measure_seconds" min="0" max="60" step="0.1">
                </div>
                <div class="form-group">
                    <label for="move_timeout_seconds">Move timeout (s):</label>
                    <input type="number" id="move_timeout_seconds" min="10" max="600">
                </div>
                <div class="form-group">
                    <label for="port">Serial port (empty = automatic scan):</label>
                    <input type="text" id="port">
                </div>
                <div class="form-group">
                    <label for="baud">Baud rate:</label>
                    <input type="number" id="baud">
                </div>
                <div class="form-group">
                    <label for="heater_config">Heater:</label>
                    <select id="heater_config">
                        <option value="1">Off</option>
                        <option value="2">Share power with motors</option>
                        <option value="3">Full heat (concurrent with motion)</option>
                    </select>
                    <div id="heaterStateLine" class="grey-note"></div>
                </div>
                <div class="form-group">
                    <label for="keepout_profile">Keep-out profile (antenna/mount geometry):</label>
                    <select id="keepout_profile">
                        <option value="">-- none (unrestricted) --</option>
                    </select>
                    <div id="keepoutStateLine" class="grey-note"></div>
                </div>
                <button type="button" onclick="submitSettings()">Submit</button>
            </form>
        </details>
    </div>

    <div id="programCard" class="container">
        <h1>Sequence</h1>
        <div id="programActive" style="display:none;">
            <div id="programStatusLine" style="text-align:center; font-weight:bold;"></div>
            <div id="programNextLine" class="grey-note"></div>
            <table id="upcomingStepsTable" style="display:none;">
                <thead><tr><th>#</th><th>pan (&deg;)</th><th>tilt (&deg;)</th></tr></thead>
                <tbody id="upcomingStepsBody"></tbody>
            </table>
            <div style="display:flex; gap:5px; justify-content:center;">
                <button type="button" onclick="programCommand('pause')">Pause</button>
                <button type="button" onclick="programCommand('resume')">Resume</button>
                <button type="button" style="background-color:#b30000;" onclick="programCommand('stop')">Stop</button>
            </div>
        </div>
        <div id="programUpload">
            <form id="programForm">
                <div class="form-group">
                    <label for="programFile">Sequence file (.yaml):</label>
                    <input type="file" id="programFile" accept=".yaml,.yml">
                </div>
                <div class="form-group">
                    <label for="programDropdown">Or pick a saved sequence:</label>
                    <select id="programDropdown" onchange="loadProgramFromDropdown()">
                        <option value="">-- select --</option>
                    </select>
                </div>
                <button type="button" onclick="previewProgram()">Preview</button>
            </form>
            <div id="programPreview" style="display:none;">
                <p id="programSummary" style="color:#333; font-size:14px; text-align:left;"></p>
                <details>
                    <summary style="cursor:pointer;">Details</summary>
                    <div id="programDetails"></div>
                </details>
                <div id="programConflicts" style="color:#b30000; font-size:13px;"></div>
                <button id="runProgramBtn" type="button" onclick="runProgram()" disabled>Run</button>
            </div>
        </div>
    </div>

    <script>

        let live = {};             // last /api/status response
        let moving = false;
        let programText = null;    // uploaded sequence file contents
        let lastPreviewResult = null;
        let cfg = {
            pan_min_abs: -180.0, pan_max_abs: 180.0,
            tilt_min_abs: -90.0, tilt_max_abs: 90.0,
            home_pan_abs: 0.0, home_tilt_abs: 0.0,
            pan_invert: 0, tilt_invert: 0
        };

        window.onload = function () {
            refreshKeepoutProfiles().then(refreshSettings);
            pollStatus();
            refreshProgramDropdown();
        };

        function pollStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    live = data;
                    updateUI(data);
                })
                .catch(error => console.error('Error fetching status:', error))
                .finally(() => setTimeout(pollStatus, 1000));
        }

        function updateHeaderState() {
            const header = document.querySelector('.header');
            if (moving) {
                header.style.borderBottom = "3px solid #3f7fd6";
                header.style.backgroundColor = "#243f5e";
            } else {
                header.style.borderBottom = "3px solid #9e9e9e";
                header.style.backgroundColor = "#323E4C";
            }
        }

        function showToast(status, message) {
            const outputDiv = document.getElementById("output");
            outputDiv.innerHTML = `<strong>${escapeHtml(status)}:</strong> ${escapeHtml(message)}`;
            outputDiv.style.display = "block";
            setTimeout(() => { outputDiv.style.display = "none"; }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateUI(data) {
            const statusLine = document.getElementById("statusLine");
            const angles = document.getElementById("angles");
            const calibrationCard = document.getElementById("calibrationCard");
            const programCard = document.getElementById("programCard");
            const faultContainer = document.getElementById("faultContainer");

            const connected = data.connected === 1;
            moving = connected && data.moving === 1;
            updateHeaderState();

            if (connected) {
                statusLine.textContent = "Connected (" + data.port + ")";
                statusLine.style.color = "#017701";
            } else {
                statusLine.textContent = "Not connected — retry in " + data.retry_in_s + " s";
                statusLine.style.color = "#b30000";
            }

            angles.style.display = connected ? "block" : "none";
            if (connected) {
                document.getElementById("panRel").textContent = Number(data.pan_rel).toFixed(1);
                document.getElementById("tiltRel").textContent = Number(data.tilt_rel).toFixed(1);
                document.getElementById("panAbs").textContent = Number(data.pan_abs).toFixed(1);
                document.getElementById("tiltAbs").textContent = Number(data.tilt_abs).toFixed(1);
                document.getElementById("movingIndicator").textContent = data.moving === 1 ? " ⟳" : "";
            }

            const heaterNames = {1: "Off", 2: "Sharing power with motors", 3: "Full heat"};
            document.getElementById("heaterStateLine").textContent =
                connected ? "Confirmed: " + (heaterNames[data.heater_state] || "unknown") : "";

            document.getElementById("keepoutStateLine").textContent = data.keepout_profile
                ? data.keepout_breakpoints + " breakpoint(s) loaded"
                : "No profile selected — moves are unrestricted by antenna geometry";

            const measureBtn = document.getElementById("measureBtn");
            if (data.measuring === 1) {
                measureBtn.textContent = "Measuring…";
                measureBtn.style.backgroundColor = "red";
                measureBtn.disabled = true;
            } else {
                measureBtn.textContent = "Take Virtual Measurement";
                measureBtn.style.backgroundColor = "#007d00";
                measureBtn.disabled = false;
            }

            const programRunning = data.program_state === "running";
            calibrationCard.classList.toggle("card-disabled", !connected || programRunning);
            programCard.classList.toggle("card-disabled", !connected);

            const programActive = data.program_state !== "";
            document.getElementById("programActive").style.display = programActive ? "block" : "none";
            document.getElementById("programUpload").style.display = programActive ? "none" : "block";
            if (programActive) {
                let line = data.program_name + " — " + data.program_state;
                if (data.program_progress) line += " — " + data.program_progress;
                document.getElementById("programStatusLine").textContent = line;

                const stepsTable = document.getElementById("upcomingStepsTable");
                const stepsBody = document.getElementById("upcomingStepsBody");

                if (data.program_type === "automated") {
                    stepsTable.style.display = "none";
                    stepsBody.innerHTML = "";
                    let nextLine = "";
                    if (data.next_measurement_utc) {
                        nextLine = "Next: pan " + Number(data.next_pan_rel).toFixed(1) + "°, tilt " +
                            Number(data.next_tilt_rel).toFixed(1) + "° in " + formatCountdown(data.next_measurement_in_s) +
                            " (" + data.next_measurement_utc + " UTC)";
                    }
                    document.getElementById("programNextLine").textContent = nextLine;
                } else {
                    let nextLine = "Finished " + data.steps_done + "/" + data.steps_total + " steps";
                    if (data.estimated_remaining_s) {
                        nextLine += " — estimated time remaining: " + formatCountdown(data.estimated_remaining_s);
                    }
                    if (data.upcoming_points && data.upcoming_points.length) {
                        stepsBody.innerHTML = data.upcoming_points.map((p, i) =>
                            "<tr><td>" + (data.steps_done + i + 1) + "</td><td>" + Number(p.pan_rel).toFixed(1) +
                            "</td><td>" + Number(p.tilt_rel).toFixed(1) + "</td></tr>"
                        ).join("");
                        stepsTable.style.display = "table";
                    } else {
                        stepsTable.style.display = "none";
                        stepsBody.innerHTML = "";
                    }
                    document.getElementById("programNextLine").textContent = nextLine;
                }
            }

            if (data.fault) {
                faultContainer.style.display = "block";
                document.getElementById("faultText").textContent = data.fault;
            } else {
                faultContainer.style.display = "none";
            }

            const logPanel = document.getElementById("logPanel");
            if (data.log) {
                logPanel.innerHTML = data.log.map(l => "<div>" + escapeHtml(l) + "</div>").join("");
                logPanel.scrollTop = logPanel.scrollHeight;
            }
        }

        function relLimits() {
            let panMin = cfg.pan_min_abs, panMax = cfg.pan_max_abs;
            if (cfg.pan_invert === 1) { [panMin, panMax] = [-panMax, -panMin]; }

            let tiltMin = cfg.tilt_min_abs, tiltMax = cfg.tilt_max_abs;
            if (cfg.tilt_invert === 1) { [tiltMin, tiltMax] = [-tiltMax, -tiltMin]; }

            return {
                pan_min: panMin - cfg.home_pan_abs,
                pan_max: panMax - cfg.home_pan_abs,
                tilt_min: tiltMin - cfg.home_tilt_abs,
                tilt_max: tiltMax - cfg.home_tilt_abs
            };
        }

        function updateRelLimitsLine() {
            const lim = relLimits();
            document.getElementById("panLimitsLine").textContent =
                "Min: " + lim.pan_min.toFixed(1) + "°   Max: " + lim.pan_max.toFixed(1) + "°";
            document.getElementById("tiltLimitsLine").textContent =
                "Min: " + lim.tilt_min.toFixed(1) + "°   Max: " + lim.tilt_max.toFixed(1) + "°";
        }

        function refreshSettings() {
            fetch('/api/settings')
                .then(response => response.json())
                .then(data => {
                    cfg = data;
                    document.getElementById("pan_invert").checked = data.pan_invert === 1;
                    document.getElementById("tilt_invert").checked = data.tilt_invert === 1;
                    document.getElementById("pan_min_abs").value = data.pan_min_abs;
                    document.getElementById("pan_max_abs").value = data.pan_max_abs;
                    document.getElementById("tilt_min_abs").value = data.tilt_min_abs;
                    document.getElementById("tilt_max_abs").value = data.tilt_max_abs;
                    document.getElementById("pan_max_speed").value = data.pan_max_speed;
                    document.getElementById("tilt_max_speed").value = data.tilt_max_speed;
                    document.getElementById("settle_seconds").value = data.settle_seconds;
                    document.getElementById("simulated_measure_seconds").value = data.simulated_measure_seconds;
                    document.getElementById("move_timeout_seconds").value = data.move_timeout_seconds;
                    document.getElementById("port").value = data.port;
                    document.getElementById("baud").value = data.baud;
                    document.getElementById("heater_config").value = data.heater_config;
                    document.getElementById("keepout_profile").value = data.keepout_profile || "";
                    updateRelLimitsLine();
                })
                .catch(error => console.error('Error refreshing settings:', error));
        }

        function refreshKeepoutProfiles() {
            return fetch('/api/keepout/profiles')
                .then(response => response.json())
                .then(profiles => {
                    const select = document.getElementById("keepout_profile");
                    const current = select.value;
                    select.innerHTML = '<option value="">-- none (unrestricted) --</option>' +
                        profiles.map(p => "<option value='" + escapeHtml(p) + "'>" + escapeHtml(p) + "</option>").join("");
                    select.value = current;
                })
                .catch(() => {});
        }

        function jog(panSign, tiltSign) {
            const step = parseFloat(document.getElementById("stepSize").value);
            fetch('/api/jog', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan: panSign * step, tilt: tiltSign * step })
            }).catch(error => alert("Error jogging: " + error));
        }

        function goHome() {
            fetch('/api/move', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan_rel: 0.0, tilt_rel: 0.0 })
            }).catch(error => alert("Error moving home: " + error));
        }

        function takeMeasurement() {
            fetch('/api/measure', { method: 'POST' }).catch(error => alert("Error: " + error));
        }

        function moveTo() {
            const pan = parseFloat(document.getElementById("gotoPan").value);
            const tilt = parseFloat(document.getElementById("gotoTilt").value);

            if (isNaN(pan) || isNaN(tilt)) {
                alert("⚠️ Enter both a pan and a tilt angle.");
                return;
            }

            const lim = relLimits();
            if (pan < lim.pan_min || pan > lim.pan_max || tilt < lim.tilt_min || tilt > lim.tilt_max) {
                alert("⚠️ Target outside the relative limits:\npan " + lim.pan_min.toFixed(1) + "° … " + lim.pan_max.toFixed(1) +
                      "°, tilt " + lim.tilt_min.toFixed(1) + "° … " + lim.tilt_max.toFixed(1) + "°");
                return;
            }

            fetch('/api/move', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan_rel: pan, tilt_rel: tilt })
            }).catch(error => alert("Error moving: " + error));
        }

        function setHomePosition() {
            if (!document.getElementById("unlockHome").checked) {
                alert("⚠️ Unlock the home position first (checkbox above the button).");
                return;
            }
            const confirmed = confirm("⚠️ Set the CURRENT position as the new home (relative 0/0)?\nThe relative limits and the validity of sequence files change with it.\n\nDo you want to continue?");
            if (!confirmed) return;

            fetch('/api/home', { method: 'POST' }).catch(error => alert("Error: " + error));
            document.getElementById("unlockHome").checked = false;
            setTimeout(refreshSettings, 1000);
        }

        function clearFault() {
            fetch('/api/clear_fault', { method: 'POST' }).catch(error => alert("Error: " + error));
        }

        function submitSettings() {
            const panMin = parseFloat(document.getElementById("pan_min_abs").value);
            const panMax = parseFloat(document.getElementById("pan_max_abs").value);
            const tiltMin = parseFloat(document.getElementById("tilt_min_abs").value);
            const tiltMax = parseFloat(document.getElementById("tilt_max_abs").value);

            if (!(panMin < panMax) || !(tiltMin < tiltMax)) {
                alert("⚠️ Each minimum limit must be smaller than its maximum.");
                return;
            }

            if (live.connected === 1 &&
                (live.pan_abs < panMin || live.pan_abs > panMax ||
                 live.tilt_abs < tiltMin || live.tilt_abs > tiltMax)) {
                const confirmed = confirm("⚠️ The current position is OUTSIDE the new absolute limits.\nThe pan-tilt positioner will refuse every move until it is back inside them.\n\nDo you want to continue?");
                if (!confirmed) return;
            }

            const panInvert = document.getElementById("pan_invert").checked ? 1 : 0;
            const tiltInvert = document.getElementById("tilt_invert").checked ? 1 : 0;
            if (panInvert !== cfg.pan_invert || tiltInvert !== cfg.tilt_invert) {
                const confirmed = confirm("⚠️ Changing pan/tilt inversion redefines what every stored home position, "
                    + "limit and sequence angle physically means.\nRe-check the home position and any saved sequences afterward.\n\nContinue?");
                if (!confirmed) return;
            }

            const values = {
                pan_min_abs: panMin, pan_max_abs: panMax,
                tilt_min_abs: tiltMin, tilt_max_abs: tiltMax,
                pan_invert: panInvert, tilt_invert: tiltInvert,
                pan_max_speed: parseInt(document.getElementById("pan_max_speed").value),
                tilt_max_speed: parseInt(document.getElementById("tilt_max_speed").value),
                settle_seconds: parseFloat(document.getElementById("settle_seconds").value),
                simulated_measure_seconds: parseFloat(document.getElementById("simulated_measure_seconds").value),
                move_timeout_seconds: parseInt(document.getElementById("move_timeout_seconds").value),
                port: document.getElementById("port").value,
                baud: parseInt(document.getElementById("baud").value),
                heater_config: parseInt(document.getElementById("heater_config").value),
                keepout_profile: document.getElementById("keepout_profile").value
            };

            fetch('/api/settings', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(values)
            })
            .then(response => response.json())
            .then(result => {
                showToast(result.status, result.message || "Settings saved.");
                setTimeout(refreshSettings, 500);
            })
            .catch(error => alert("Error saving settings: " + error));
        }

        function formatCountdown(totalSeconds) {
            const s = Math.max(0, Math.floor(totalSeconds));
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const rem = s % 60;
            if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(rem).padStart(2, "0");
            return m + ":" + String(rem).padStart(2, "0");
        }

        function refreshProgramDropdown() {
            fetch('/api/program/list')
                .then(response => response.json())
                .then(files => {
                    const select = document.getElementById("programDropdown");
                    select.innerHTML = '<option value="">-- select --</option>' +
                        files.map(f => "<option value='" + escapeHtml(f) + "'>" + escapeHtml(f) + "</option>").join("");
                })
                .catch(() => {});
        }

        function loadProgramFromDropdown() {
            const name = document.getElementById("programDropdown").value;
            if (!name) return;

            document.getElementById("programFile").value = "";

            fetch('/api/program/content?name=' + encodeURIComponent(name))
                .then(response => {
                    if (!response.ok) throw new Error("Could not load " + name);
                    return response.text();
                })
                .then(text => {
                    programText = text;
                    fetch('/api/program/preview', {
                        method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: programText
                    })
                    .then(response => response.json())
                    .then(renderProgramPreview)
                    .catch(error => alert("Error validating sequence: " + error));
                })
                .catch(error => alert("Error loading sequence: " + error));
        }

        function previewProgram() {
            const fileInput = document.getElementById("programFile");
            if (!fileInput.files.length) {
                alert("⚠️ Choose a sequence file first.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                programText = e.target.result;
                fetch('/api/program/preview', {
                    method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: programText
                })
                .then(response => response.json())
                .then(renderProgramPreview)
                .catch(error => alert("Error validating sequence: " + error));
            };
            reader.readAsText(fileInput.files[0]);
        }

        function renderProgramPreview(result) {
            const preview = document.getElementById("programPreview");
            const summary = document.getElementById("programSummary");
            const details = document.getElementById("programDetails");
            const conflicts = document.getElementById("programConflicts");
            const runBtn = document.getElementById("runProgramBtn");

            preview.style.display = "block";
            lastPreviewResult = null;

            if (result.status === "error") {
                summary.innerHTML = "<span style='color:#b30000;'>Invalid sequence: " + escapeHtml(result.message) + "</span>";
                details.innerHTML = "";
                conflicts.innerHTML = "";
                runBtn.disabled = true;
                return;
            }

            const s = result.summary;
            let line = "<strong>" + escapeHtml(s.name) + "</strong> — " + s.type + ", " + s.n_points + " points, " + s.tries + " tries per point";
            if (s.estimated_minutes !== undefined) line += ", estimated duration ~" + s.estimated_minutes + " min";
            if (!result.valid) line += " — <span style='color:#b30000;'>INVALID</span>";

            if (s.home_pan_abs !== undefined || s.home_tilt_abs !== undefined ||
                s.pan_orientation !== undefined || s.tilt_orientation !== undefined) {
                line += "<br><span style='font-size:13px; color:#333;'>Recorded setup: ";
                const parts = [];
                if (s.home_pan_abs !== undefined) parts.push("home pan " + s.home_pan_abs + "°");
                if (s.home_tilt_abs !== undefined) parts.push("home tilt " + s.home_tilt_abs + "°");
                if (s.pan_orientation !== undefined) parts.push("pan orientation " + s.pan_orientation);
                if (s.tilt_orientation !== undefined) parts.push("tilt orientation " + s.tilt_orientation);
                line += parts.join(", ") + "</span>";
            }
            summary.innerHTML = line;

            let html = "<table><tr><th>#</th><th>pan (°)</th><th>tilt (°)</th><th>check</th></tr>";
            result.points.forEach(p => {
                html += "<tr class='point-" + p.status + "'><td>" + (p.index + 1) + "</td><td>" + p.pan_deg + "</td><td>" + p.tilt_deg + "</td>";
                html += "<td>" + escapeHtml(p.message || "ok") + "</td></tr>";
            });
            html += "</table>";
            details.innerHTML = html;

            let conflictsHtml = (result.conflicts || []).map(c => "⚠️ " + escapeHtml(c.message)).join("<br>");
            if (result.home_warnings && result.home_warnings.length) {
                if (conflictsHtml) conflictsHtml += "<br>";
                conflictsHtml += result.home_warnings.map(w => "⚠️ " + escapeHtml(w)).join("<br>");
            }
            conflicts.innerHTML = conflictsHtml;
            runBtn.disabled = !result.valid;

            lastPreviewResult = result;
        }

        function runProgram() {
            if (!programText) return;

            if (lastPreviewResult && lastPreviewResult.home_warnings && lastPreviewResult.home_warnings.length) {
                const confirmed = confirm("⚠️ " + lastPreviewResult.home_warnings.join("\n⚠️ ") + "\n\nContinue?");
                if (!confirmed) return;
            }

            fetch('/api/program/run', {
                method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: programText
            })
            .then(response => response.json())
            .then(result => {
                showToast(result.status, result.message);
                if (result.status === "success") {
                    document.getElementById("programPreview").style.display = "none";
                    document.getElementById("programFile").value = "";
                    document.getElementById("programDropdown").value = "";
                    programText = null;
                    lastPreviewResult = null;
                    refreshProgramDropdown();
                }
            })
            .catch(error => alert("Error starting sequence: " + error));
        }

        function programCommand(action) {
            if (action === 'stop') {
                const confirmed = confirm("Stop the sequence?\nThe progress is discarded.");
                if (!confirmed) return;
            }
            fetch('/api/program/' + action, { method: 'POST' }).catch(error => alert("Error: " + error));
        }

    </script>
</body>
</html>
